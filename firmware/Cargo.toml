[package]
name = "blackpill-blink"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
usb-device = "0.3.2"
usbd-midi = "0.5.1"
embedded-hal = "0.2.7"
rtt-target = "0.5.0"

# stm32f4xx-hal support for Black Pill (STM32F411 / STM32F401)
[dependencies.stm32f4xx-hal]
version = "0.20.0"
features = ["stm32f411", "usb_fs"]
